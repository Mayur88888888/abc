<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="WebCAD Pro - Browser-Based 3D CAD System" />
    <meta name="theme-color" content="#030712" />
    <title>WebCAD Pro | Browser-Based CAD System</title>

    <!-- Favicon (inline SVG to avoid 404) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23030712'/%3E%3Ctext x='50' y='68' font-size='50' text-anchor='middle' fill='%238b5cf6' font-family='monospace' font-weight='bold'%3E3D%3C/text%3E%3C/svg%3E" />

    <style>
      /* Prevent flash of unstyled content */
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #030712;
        color: #ffffff;
      }
      /* Loading spinner shown before React mounts */
      #loading-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #030712;
        z-index: 9999;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      #loading-screen .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid rgba(139, 92, 246, 0.2);
        border-top-color: #8b5cf6;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      #loading-screen .text {
        margin-top: 16px;
        color: #6b7280;
        font-size: 14px;
        letter-spacing: 0.05em;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>

    <!-- Disable Brave translation for this app -->
    <meta name="google" content="notranslate" />
  </head>
  <body>
    <!-- Loading screen (removed once React mounts) -->
    <div id="loading-screen">
      <div class="spinner"></div>
      <div class="text">Loading WebCAD Pro...</div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
